[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rbsforge"
version = "0.1.0"
description = "Thermodynamics-based ribosome binding site (RBS) strength prediction for arbitrary bacterial hosts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rbsforge = "rbsforge.cli:main"

[tool.setuptools.packages.find]
include = ["rbsforge*"]
