[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "operon-calculator"
version = "0.2.0"
description = "A recreation of the Salis Lab Operon Calculator: RBSForge (RBS strength prediction) plus the assembly, coupling, elongation, stability, promoter, and undesired-element modules built on top of it"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rbsforge = "rbsforge.cli:main"

[tool.setuptools.packages.find]
include = ["rbsforge*", "operon*"]
